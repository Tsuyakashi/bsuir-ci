workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
    - when: never

stages: [test, build, release, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE

test:
  stage: test
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - python/**/*
  script:
    - cd python
    - pip install --no-cache-dir -r requirements.txt pytest
    - python -m pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: python/report.xml

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - python/**/*
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - TREE=$(git rev-parse HEAD:python)
    - docker build -t "$IMAGE:$CI_COMMIT_SHA" -t "$IMAGE:src-$TREE" -t "$IMAGE:dev" python/
    - docker push "$IMAGE:$CI_COMMIT_SHA"
    - docker push "$IMAGE:src-$TREE"
    - docker push "$IMAGE:dev"

# Direct pushes to main are blocked (protected branch),
# so every push here is an MR merge.
promote:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache git skopeo
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - echo "$CI_REGISTRY_PASSWORD" | skopeo login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - TREE=$(git rev-parse HEAD:python)
    - |
      if ! skopeo inspect --raw "docker://$IMAGE:src-$TREE" >/dev/null 2>&1; then
        echo "no image for python/ tree $TREE — main diverged in python/, rebase the branch"
        exit 1
      fi
    - skopeo copy --all "docker://$IMAGE:src-$TREE" "docker://$IMAGE:prod"
    - skopeo copy --all "docker://$IMAGE:src-$TREE" "docker://$IMAGE:merged-$CI_COMMIT_SHA"

.deploy:
  stage: deploy
  tags: [bsuir-ci-ct]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker compose -p "bsuir-ci-$CI_ENVIRONMENT_NAME" -f compose.yml pull
    - docker compose -p "bsuir-ci-$CI_ENVIRONMENT_NAME" -f compose.yml up -d --wait --wait-timeout 60
    - docker image prune -af
  after_script:
    - docker logout "$CI_REGISTRY"

deploy-dev:
  extends: .deploy
  needs:
    - job: build
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - python/**/*
        - compose.yml
        - .gitlab-ci.yml
  before_script:
    - export IMAGE_TAG="src-$(git rev-parse HEAD:python)"
  variables:
    PORT: "8081"
  environment:
    name: dev
    url: https://dev-bsuir-app.tail65829d.ts.net

deploy-prod:
  extends: .deploy
  needs: [promote]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    IMAGE_TAG: merged-$CI_COMMIT_SHA
    PORT: "8080"
  environment:
    name: prod
    url: https://bsuir-app.tail65829d.ts.net

deploy-observability:
  stage: deploy
  tags: [bsuir-ci-ct]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - observability/**/*
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - observability/**/*
      when: manual
      allow_failure: true
  script:
    - cd observability
    - docker compose -p bsuir-observability pull
    - docker compose -p bsuir-observability up -d --wait --wait-timeout 300
    - |
      curl -fsS -X POST http://127.0.0.1:5601/api/data_views/data_view \
        -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
        -d '{"data_view":{"id":"bsuir-app","title":"bsuir-app-*","name":"bsuir-app","timeFieldName":"@timestamp"},"override":true}'
    - |
      curl -fsS -X PUT http://127.0.0.1:9200/_index_template/bsuir-app \
        -H 'Content-Type: application/json' \
        -d '{"index_patterns":["bsuir-app-*"],"template":{"settings":{"number_of_replicas":0}}}'
    - |
      curl -fsS -X PUT 'http://127.0.0.1:9200/bsuir-app-*/_settings' \
        -H 'Content-Type: application/json' \
        -d '{"index":{"number_of_replicas":0}}'
  environment:
    name: observability
    url: https://kibana-bsuir-app.tail65829d.ts.net
