filebeat.inputs:
  - type: filestream
    id: docker-containers
    paths:
      - /var/lib/docker/containers/*/*.log
    parsers:
      - container: ~

processors:
  - add_docker_metadata: ~
  - drop_event:
      when:
        not:
          or:
            - equals:
                container.labels.com_docker_compose_project: "bsuir-ci-dev"
            - equals:
                container.labels.com_docker_compose_project: "bsuir-ci-prod"

output.logstash:
  hosts: ["logstash:5044"]
