input {
  beats { port => 5044 }
}

filter {
  mutate {
    copy => { "[container][labels][com_docker_compose_project]" => "env" }
  }
  mutate {
    gsub => [ "env", "^bsuir-ci-", "" ]
  }

  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "access"
    }
    if [access][path] == "/health" {
      drop {}
    }
    mutate {
      gsub => [ "[access][time]", "[\[\]]", "" ]
      add_tag => [ "access" ]
    }
    date {
      match => [ "[access][time]", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
  } else {
    grok {
      match => { "message" => "^\[%{DATA:log_time}\] (\[%{NUMBER:pid}\] )?\[?%{LOGLEVEL:level}\]? %{GREEDYDATA:log_message}" }
      tag_on_failure => [ "_unparsed" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "bsuir-app-%{env}-%{+YYYY.MM.dd}"
  }
}
