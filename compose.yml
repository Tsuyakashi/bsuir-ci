services:
  app:
    image: ${IMAGE}:${IMAGE_TAG}
    ports:
      - "127.0.0.1:${PORT}:80"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health', timeout=2)" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
